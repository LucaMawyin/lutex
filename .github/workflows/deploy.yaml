name: Deploy Lutex

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' '${{ secrets.PI_SSH_KEY }}' > ~/.ssh/github_actions
          chmod 600 ~/.ssh/github_actions

          cat > ~/.ssh/config <<'EOF'
          Host ssh.lucamawyin.com
            HostName ssh.lucamawyin.com
            User lucamawyin
            IdentityFile ~/.ssh/github_actions
            StrictHostKeyChecking no
          EOF

          chmod 600 ~/.ssh/config

      - name: Deploy to Raspberry Pi
        run: |
          ssh ssh.lucamawyin.com <<'EOF'
            cd /home/lucamawyin/lutex
            ./deploy.sh
          EOF
